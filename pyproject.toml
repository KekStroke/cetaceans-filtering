[project]
name = "cetaceans-filtering"
version = "0.1.0"
description = "Reproducible pipelines for cetacean audio filtering and representation learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  'joblib>=1.5.3',
  'numpy>=2.4.4',
  'pandas>=2.3.3',
  'pyyaml>=6.0.3',
  'requests>=2.33.1',
  'tqdm>=4.67.3',
  "beautifulsoup4>=4.14.3",
  "boto3>=1.40.52",
  "datasets[audio]>=4.8.4",
  "hydra-core>=1.3.2",
  "librosa>=0.11.0",
  "matplotlib>=3.10.7",
  "onc>=2.6.0",
  "scikit-learn>=1.8.0",
  "soundfile>=0.13.1",
]

[dependency-groups]
perch = ["perch-hoplite[tf]"]

[tool.uv.sources]
perch-hoplite = { git = "https://github.com/google-research/perch-hoplite" }
